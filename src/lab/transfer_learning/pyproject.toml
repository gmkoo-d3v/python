[project]
name = "transfer-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gmk", email = "227376749+gmkoo-d3v@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "torch>=2.14.1",
    "torchvision",
]

# 루트 워크스페이스에서 분리됨: PyPI의 Windows torch는 CPU 전용이므로 CUDA 빌드 인덱스를 유지한다
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[project.scripts]
transfer-learning = "transfer_learning:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
