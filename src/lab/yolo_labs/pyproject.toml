[project]
name = "yolo-labs"
version = "0.1.0"
description = "YOLO 특강 실습판"
requires-python = ">=3.12,<3.14"
dependencies = [
    "certifi>=2024.2.2",
    "numpy>=2.5.3",
    "opencv-python>=4.7.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.208",
]

[tool.uv]
package = false

# PyPI의 Windows torch는 CPU 전용이므로 CUDA 빌드 인덱스를 유지한다
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
